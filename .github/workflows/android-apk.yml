name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: haru-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Restore protected signing key when configured
        id: protected-key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HARU_SIGNING_KEY_BASE64: ${{ secrets.HARU_SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          if [ -n "$HARU_SIGNING_KEY_BASE64" ]; then
            install -d -m 700 "$HOME/.android"
            printf '%s' "$HARU_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore legacy signing key for upgrade compatibility
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.protected-key.outputs.restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: haru-debug-signing-v1

      - name: Report signing-key source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -s "$HOME/.android/debug.keystore" ]; then
            echo "A stored HARU signing keystore is available."
          else
            echo "No stored keystore was restored. Continue only to build and verify the configured signer."
            echo "Publication is still blocked unless the APK certificate exactly matches v0.7.0."
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Validate companion runtime before release
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build optimized HARU APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haru-android-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK and existing signing certificate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/haru-previous"
          gh release download v0.7.0 --pattern 'HARU-v0.7.0-Standalone-arm64.apk' --dir "$RUNNER_TEMP/haru-previous"
          PREVIOUS="$RUNNER_TEMP/haru-previous/HARU-v0.7.0-Standalone-arm64.apk"
          echo "cc25eb1bf96ee00840d45e6df8021ebd6cfeb5697fd2aac672b0c59d193b5424  $PREVIOUS" | sha256sum --check
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$PREVIOUS" > "$RUNNER_TEMP/previous-cert.txt"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-cert.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt" > "$RUNNER_TEMP/previous-fingerprint.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/current-cert.txt" > "$RUNNER_TEMP/current-fingerprint.txt"
          diff "$RUNNER_TEMP/previous-fingerprint.txt" "$RUNNER_TEMP/current-fingerprint.txt"

      - name: Package APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK="HARU-v$VERSION-Standalone-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HARU-v${{ env.VERSION }}-Standalone-arm64
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: release-apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Identify release
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=HARU-v$VERSION-Standalone-arm64.apk" >> "$GITHUB_ENV"
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: HARU-v${{ env.VERSION }}-Standalone-arm64
      - name: Verify artifact checksum
        run: sha256sum --check "$APK.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          NOTES_FILE="docs/release-v$VERSION.md"
          test -s "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the app version; published APKs are not overwritten."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "HARU $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
