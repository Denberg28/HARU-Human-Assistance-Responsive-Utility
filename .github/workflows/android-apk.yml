name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: haru-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Restore protected HARU release signer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HARU_SIGNING_BUNDLE_BASE64: ${{ secrets.HARU_SIGNING_BUNDLE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$HARU_SIGNING_BUNDLE_BASE64" ]; then
            echo "HARU_SIGNING_BUNDLE_BASE64 is not configured. Publication is blocked."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/haru-signing"
          install -d -m 700 "$SIGNING_DIR"
          printf '%s' "$HARU_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/haru-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/haru-signing.tar.gz" -C "$SIGNING_DIR"
          test -s "$SIGNING_DIR/haru-release.jks"
          test -s "$SIGNING_DIR/signing.properties"

          STORE_PASSWORD=$(sed -n 's/^storePassword=//p' "$SIGNING_DIR/signing.properties")
          KEY_PASSWORD=$(sed -n 's/^keyPassword=//p' "$SIGNING_DIR/signing.properties")
          KEY_ALIAS=$(sed -n 's/^keyAlias=//p' "$SIGNING_DIR/signing.properties")
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "HARU_KEYSTORE_PATH=$SIGNING_DIR/haru-release.jks" >> "$GITHUB_ENV"
          echo "HARU_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HARU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "HARU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HARU_RELEASE_REQUIRED=true" >> "$GITHUB_ENV"

          EXPECTED="287e7b70e0b49c9f2beeb2fd94ed7699c14616c7baef09d43befa6848b035ebf"
          ACTUAL=$(keytool -list -v \
            -keystore "$SIGNING_DIR/haru-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          test "$ACTUAL" = "$EXPECTED"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Validate companion runtime before release
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build optimized HARU APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haru-android-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify release APK signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Package APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK="HARU-v$VERSION-Standalone-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HARU-v${{ env.VERSION }}-Standalone-arm64
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: release-apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Identify release
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=HARU-v$VERSION-Standalone-arm64.apk" >> "$GITHUB_ENV"
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: HARU-v${{ env.VERSION }}-Standalone-arm64
      - name: Verify artifact checksum
        run: sha256sum --check "$APK.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          NOTES_FILE="docs/release-v$VERSION.md"
          test -s "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the app version; published APKs are not overwritten."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "HARU $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
