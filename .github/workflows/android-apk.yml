name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: haru-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Restore stable HARU signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: haru-debug-signing-v1

      - name: Require the existing signing identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "Original HARU signing key is unavailable. Restore it before building an update."
            exit 1
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build optimized HARU APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haru-android-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Package APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK="HARU-v$VERSION-Standalone-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HARU-v${{ env.VERSION }}-Standalone-arm64
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          NOTES_FILE="docs/release-v$VERSION.md"
          test -s "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the app version; published APKs are not overwritten."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "HARU $TAG" \
            --notes-file "$NOTES_FILE" \
            --latest
