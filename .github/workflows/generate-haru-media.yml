name: Generate HARU media

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_haru_media.py"
      - ".github/workflows/generate-haru-media.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install media dependency
        run: python -m pip install "Pillow>=11,<13"

      - name: Generate mascot and theme
        run: python scripts/generate_haru_media.py

      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet -- assets/; then
            echo "Generated media is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/haru_animation.gif assets/haru_cute_theme.wav
          git commit -m "assets: regenerate HARU mascot and theme [skip ci]"
          git push
