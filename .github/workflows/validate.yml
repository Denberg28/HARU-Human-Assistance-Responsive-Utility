name: Validate HARU

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Compile Python runtime
        run: |
          python -m compileall -q streamlit_app.py ai_runtime.py credential_store.py news_service.py hazard_service.py tests

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Check forbidden secret files and stale references
        shell: bash
        run: |
          test ! -f .streamlit/secrets.toml

          if grep -n -E 'haru_animation|haru_cute_theme|generate_haru_media|HARU_THEME|music_enabled' \
            streamlit_app.py ai_runtime.py run_haru_local.bat README.md; then
            echo "Found stale media reference."
            exit 1
          fi

          if git grep -n -E 'AIza[0-9A-Za-z_-]{20,}|sk-or-v1-[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'; then
            echo "Found a high-confidence committed secret pattern."
            exit 1
          fi
